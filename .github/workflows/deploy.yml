name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, hefeiyu ]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build site
        env:
          # GitHub Pages 部署在 https://hefy2027.github.io/feiyu-blog/ 子路径下，
          # 注入 BASE_PATH 与 SITE_URL 让 Astro 把资源路径和 sitemap URL 指向该子路径；
          # Cloudflare 部署不读取这两个变量，保持 base: "/" 与 site: siteConfig.site_url。
          BASE_PATH: /feiyu-blog/
          SITE_URL: https://hefy2027.github.io/feiyu-blog
        run: pnpm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Astro默认构建输出目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4